# Deploy the cedar branch to api.cedar.sd.
# master keeps using .github/workflows/deploy.yml and is not triggered here.

name: Deploy cedar

on:
  push:
    branches:
      - cedar
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: cedar.sd
      SSH_USER: cedarsd
      SSH_OPTS: -o StrictHostKeyChecking=yes -o IPQoS=none -o ServerAliveInterval=15 -o ServerAliveCountMax=20 -o ConnectTimeout=20 -o TCPKeepAlive=yes
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npx nest build

      - name: Confirm build entry
        run: test -f dist/main.js

      - name: Keep production dependencies only
        run: npm prune --omit=dev

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CEDAR_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh-keyscan -H 89.163.214.37 >> ~/.ssh/known_hosts

      - name: Create deploy archive
        run: |
          tar -czf api-release.tar.gz \
            dist \
            node_modules \
            package.json \
            package-lock.json \
            scripts/cedar-ensure-schema.js \
            scripts/baseline-migrations.js \
            scripts/cedar-remote.sh

      - name: Upload archive
        run: |
          retry() {
            local n=1
            local max=5
            while true; do
              if "$@"; then
                return 0
              fi
              if [ "$n" -ge "$max" ]; then
                echo "Command failed after ${max} attempts"
                return 1
              fi
              echo "SSH dropped (attempt ${n}). Waiting 20s..."
              n=$((n + 1))
              sleep 20
            done
          }
          retry ssh -i ~/.ssh/deploy_key $SSH_OPTS \
            "$SSH_USER@$SSH_HOST" "mkdir -p /home/cedarsd/deploy && rm -rf /home/cedarsd/deploy/api-stage"
          retry scp -i ~/.ssh/deploy_key $SSH_OPTS \
            api-release.tar.gz scripts/cedar-remote.sh \
            "$SSH_USER@$SSH_HOST:/home/cedarsd/deploy/"

      - name: Install, migrate, and start
        env:
          CEDARSD_DB_PASSWORD: ${{ secrets.CEDARSD_DB_PASSWORD }}
        run: |
          B64="$(printf '%s' "$CEDARSD_DB_PASSWORD" | base64 -w0)"
          ssh -i ~/.ssh/deploy_key $SSH_OPTS \
            "$SSH_USER@$SSH_HOST" \
            "chmod 700 /home/cedarsd/deploy/cedar-remote.sh && DB_PASSWORD_B64='$B64' bash /home/cedarsd/deploy/cedar-remote.sh"
          echo "::warning::This shared host stops Node when SSH ends. Keep the API up with DirectAdmin Cron Jobs running /home/cedarsd/domains/api.cedar.sd/app/ensure-running.sh every minute."

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key api-release.tar.gz
